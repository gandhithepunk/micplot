<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mic Plot</title>
  <style>
    :root {
      --bg: #000000;
      --card: #141414;
      --field: #111111;
      --border: #2c2c2c;
      --border-light: #3a3a3a;
      --accent: #7a5cf0;
      --green: #3f9e6d;
      --red: #c25b52;
      --text: #eaeaea;
      --text-muted: #888888;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 500;
      margin: 0;
      padding: 3rem 1.5rem;
      display: flex;
      justify-content: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p { color: var(--text-muted); line-height: 1.5; }
    code {
      background: var(--field);
      border: 1px solid var(--border-light);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mic Plot — server is running</h1>
    <p>
      This is a placeholder page. The API is live at <code>/api/shows</code>,
      <code>/health</code>, etc. Build the mic-entry form and dashboard here
      in <code>src/client</code>.
    </p>
    <p>See the project README for next steps.</p>
  </div>
</body>
</html>

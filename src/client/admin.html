<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mic Plot — Admin</title>
  <style>
    :root {
      --bg: #000000;
      --card: #141414;
      --field: #111111;
      --border: #2c2c2c;
      --border-light: #3a3a3a;
      --accent: #7a5cf0;
      --green: #3f9e6d;
      --red: #c25b52;
      --text: #eaeaea;
      --text-muted: #888888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 500;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }
    .page { max-width: 600px; margin: 0 auto; }

    /* Header */
    .page-header {
      margin-bottom: 2rem;
    }
    .page-header-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 500; }

    /* Sections */
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* Add show form */
    .add-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .add-row input {
      background: var(--field);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.6rem 0.75rem;
      -webkit-appearance: none;
    }
    .add-row input:focus { outline: none; border-color: var(--accent); }
    .input-code { width: 7rem; }
    .input-name { flex: 1; min-width: 160px; }
    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.6rem 1.25rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-add:hover { opacity: 0.9; }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; }
    .form-msg {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      min-height: 1em;
    }
    .form-msg.error { color: var(--red); }
    .form-msg.success { color: var(--green); }

    /* Show list */
    .shows-list { display: flex; flex-direction: column; gap: 0; }

    .show-row {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .show-row:last-child { border-bottom: none; }
    .show-row.archived { opacity: 0.55; }

    /* Normal row */
    .row-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .show-code {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 3rem;
      font-variant-numeric: tabular-nums;
    }
    .show-name { flex: 1; font-size: 0.95rem; }
    .row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }

    /* Small action buttons */
    .btn-sm {
      border-radius: 5px;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid var(--border-light);
      background: var(--field);
      color: var(--text-muted);
    }
    .btn-sm:hover { color: var(--text); border-color: var(--border-light); }
    .btn-sm.archive:hover { border-color: var(--text-muted); }
    .btn-sm.restore { color: var(--green); border-color: rgba(63,158,109,0.35); }
    .btn-sm.restore:hover { background: rgba(63,158,109,0.08); }
    .btn-sm.delete-show { color: var(--red); border-color: rgba(194,91,82,0.35); }
    .btn-sm.delete-show:hover { background: rgba(194,91,82,0.08); }
    .btn-sm.save-edit { color: var(--accent); border-color: rgba(122,92,240,0.4); }
    .btn-sm.save-edit:hover { background: rgba(122,92,240,0.08); }

    /* Inline edit row */
    .row-edit {
      display: none;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .row-edit input {
      background: var(--field);
      border: 1px solid var(--border-light);
      border-radius: 5px;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.35rem 0.6rem;
    }
    .row-edit input:focus { outline: none; border-color: var(--accent); }
    .edit-code-input { width: 6rem; }
    .edit-name-input { flex: 1; min-width: 140px; }

    /* Delete confirmation */
    .row-confirm {
      display: none;
      margin-top: 0.6rem;
      padding: 0.75rem;
      background: rgba(194,91,82,0.07);
      border: 1px solid rgba(194,91,82,0.25);
      border-radius: 6px;
    }
    .confirm-msg { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.6rem; }
    .confirm-actions { display: flex; gap: 0.5rem; }
    .btn-confirm-cancel {
      flex: 1;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 500;
      font-size: 0.82rem;
      padding: 0.4rem;
      cursor: pointer;
      text-align: center;
    }
    .btn-confirm-delete {
      flex: 1;
      background: var(--red);
      border: none;
      border-radius: 5px;
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.82rem;
      padding: 0.4rem;
      cursor: pointer;
      text-align: center;
    }
    .btn-confirm-delete:hover { opacity: 0.85; }
    .btn-confirm-delete:disabled { opacity: 0.45; cursor: not-allowed; }

    .row-msg {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--red);
      min-height: 1em;
    }

    .empty-list {
      font-size: 0.875rem;
      color: var(--text-muted);
      padding: 0.5rem 0;
    }

    /* Archived section hidden when empty */
    .archived-section { display: none; }
  </style>
</head>
<body>
<div class="page">

  <div class="page-header">
    <div class="page-header-label">Mic Plot</div>
    <h1>Admin — Shows</h1>
  </div>

  <!-- Add show -->
  <div class="section">
    <div class="section-label">Add Show</div>
    <div class="add-row">
      <input class="input-code" id="new-code" type="text" placeholder="Code (HAM)" autocomplete="off" maxlength="10" />
      <input class="input-name" id="new-name" type="text" placeholder="Name (Hamlet)" autocomplete="off" />
      <button class="btn-add" id="btn-add" type="button">Add</button>
    </div>
    <div class="form-msg" id="add-msg"></div>
  </div>

  <!-- Active shows -->
  <div class="section">
    <div class="section-label">Active Shows</div>
    <div class="shows-list" id="active-list">
      <div class="empty-list">Loading...</div>
    </div>
  </div>

  <!-- Archived shows (hidden when empty) -->
  <div class="section archived-section" id="archived-section">
    <div class="section-label">Archived Shows</div>
    <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.75rem;">
      Archived shows are hidden from crew pickers. Deleting a show permanently removes all its mic entries and photos.
    </p>
    <div class="shows-list" id="archived-list"></div>
  </div>

</div>
<script>
(function () {
  let shows = [];

  const activeList    = document.getElementById('active-list');
  const archivedList  = document.getElementById('archived-list');
  const archivedSec   = document.getElementById('archived-section');
  const newCode       = document.getElementById('new-code');
  const newName       = document.getElementById('new-name');
  const btnAdd        = document.getElementById('btn-add');
  const addMsg        = document.getElementById('add-msg');

  // ── Load ──────────────────────────────────────────────────────────────────
  async function loadShows() {
    try {
      const res = await fetch('/api/shows');
      shows = await res.json();
      renderShows();
    } catch {
      activeList.innerHTML = '<div class="empty-list">Failed to load shows.</div>';
    }
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderShows() {
    const active   = shows.filter(s => s.active);
    const archived = shows.filter(s => !s.active);

    activeList.innerHTML = '';
    if (active.length === 0) {
      activeList.innerHTML = '<div class="empty-list">No active shows.</div>';
    } else {
      active.forEach(s => activeList.appendChild(makeRow(s)));
    }

    archivedList.innerHTML = '';
    archived.forEach(s => archivedList.appendChild(makeRow(s)));
    archivedSec.style.display = archived.length > 0 ? 'block' : 'none';
  }

  // ── Row builder ────────────────────────────────────────────────────────────
  function makeRow(show) {
    const div = document.createElement('div');
    div.className = 'show-row' + (show.active ? '' : ' archived');
    div.dataset.id = show.id;

    if (show.active) {
      // Active row: Edit + Archive
      div.innerHTML = `
        <div class="row-main">
          <span class="show-code">${esc(show.code)}</span>
          <span class="show-name">${esc(show.name)}</span>
          <div class="row-actions">
            <button class="btn-sm edit-btn" type="button">Edit</button>
            <button class="btn-sm archive" type="button">Archive</button>
          </div>
        </div>
        <div class="row-edit">
          <input class="edit-code-input" type="text" value="${esc(show.code)}" maxlength="10" autocomplete="off" />
          <input class="edit-name-input" type="text" value="${esc(show.name)}" autocomplete="off" />
          <div class="row-actions">
            <button class="btn-sm save-edit" type="button">Save</button>
            <button class="btn-sm cancel-edit" type="button">Cancel</button>
          </div>
        </div>
        <div class="row-msg"></div>
      `;

      const rowMain  = div.querySelector('.row-main');
      const rowEdit  = div.querySelector('.row-edit');
      const rowMsg   = div.querySelector('.row-msg');
      const editBtn  = div.querySelector('.edit-btn');
      const archBtn  = div.querySelector('.archive');
      const saveBtn  = div.querySelector('.save-edit');
      const cancelBtn = div.querySelector('.cancel-edit');
      const codeInput = div.querySelector('.edit-code-input');
      const nameInput = div.querySelector('.edit-name-input');

      editBtn.addEventListener('click', () => {
        rowMain.style.display = 'none';
        rowEdit.style.display = 'flex';
        nameInput.focus();
      });

      cancelBtn.addEventListener('click', () => {
        rowEdit.style.display = 'none';
        rowMain.style.display = 'flex';
        rowMsg.textContent = '';
      });

      saveBtn.addEventListener('click', async () => {
        const code = codeInput.value.trim();
        const name = nameInput.value.trim();
        if (!code || !name) { rowMsg.textContent = 'Code and name are required.'; return; }
        saveBtn.disabled = true;
        try {
          const res = await fetch(`/api/shows/${show.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, name }),
          });
          if (!res.ok) throw new Error();
          await loadShows();
        } catch {
          rowMsg.textContent = 'Save failed.';
          saveBtn.disabled = false;
        }
      });

      archBtn.addEventListener('click', async () => {
        archBtn.disabled = true;
        try {
          await fetch(`/api/shows/${show.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: false }),
          });
          await loadShows();
        } catch {
          rowMsg.textContent = 'Failed to archive.';
          archBtn.disabled = false;
        }
      });

    } else {
      // Archived row: Restore + Delete (with confirmation)
      div.innerHTML = `
        <div class="row-main">
          <span class="show-code">${esc(show.code)}</span>
          <span class="show-name">${esc(show.name)}</span>
          <div class="row-actions">
            <button class="btn-sm restore" type="button">Restore</button>
            <button class="btn-sm delete-show" type="button">Delete</button>
          </div>
        </div>
        <div class="row-confirm">
          <div class="confirm-msg">
            Permanently delete <strong>${esc(show.name)}</strong>?
            All mic entries and photos for this show will be deleted. This cannot be undone.
          </div>
          <div class="confirm-actions">
            <button class="btn-confirm-cancel" type="button">Cancel</button>
            <button class="btn-confirm-delete" type="button">Delete Forever</button>
          </div>
        </div>
        <div class="row-msg"></div>
      `;

      const rowMsg      = div.querySelector('.row-msg');
      const restoreBtn  = div.querySelector('.restore');
      const deleteBtn   = div.querySelector('.delete-show');
      const rowConfirm  = div.querySelector('.row-confirm');
      const confirmCancel = div.querySelector('.btn-confirm-cancel');
      const confirmDelete = div.querySelector('.btn-confirm-delete');

      restoreBtn.addEventListener('click', async () => {
        restoreBtn.disabled = true;
        try {
          await fetch(`/api/shows/${show.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: true }),
          });
          await loadShows();
        } catch {
          rowMsg.textContent = 'Failed to restore.';
          restoreBtn.disabled = false;
        }
      });

      deleteBtn.addEventListener('click', () => {
        rowConfirm.style.display = '';
        deleteBtn.style.display = 'none';
      });

      confirmCancel.addEventListener('click', () => {
        rowConfirm.style.display = 'none';
        deleteBtn.style.display = '';
        rowMsg.textContent = '';
      });

      confirmDelete.addEventListener('click', async () => {
        confirmDelete.disabled = true;
        confirmDelete.textContent = 'Deleting...';
        try {
          const res = await fetch(`/api/shows/${show.id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error();
          await loadShows();
        } catch {
          confirmDelete.disabled = false;
          confirmDelete.textContent = 'Delete Forever';
          rowMsg.textContent = 'Delete failed.';
        }
      });
    }

    return div;
  }

  // ── Add show ───────────────────────────────────────────────────────────────
  async function addShow() {
    const code = newCode.value.trim();
    const name = newName.value.trim();

    if (!code || !name) {
      setAddMsg('Code and name are required.', 'error');
      return;
    }

    btnAdd.disabled = true;
    setAddMsg('', '');

    try {
      const res = await fetch('/api/shows', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, name }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Failed');
      }
      newCode.value = '';
      newName.value = '';
      setAddMsg('Show added.', 'success');
      await loadShows();
    } catch (err) {
      setAddMsg(err.message || 'Failed to add show.', 'error');
    } finally {
      btnAdd.disabled = false;
    }
  }

  function setAddMsg(msg, type) {
    addMsg.textContent = msg;
    addMsg.className = 'form-msg' + (type ? ` ${type}` : '');
    if (type === 'success') setTimeout(() => { addMsg.textContent = ''; }, 3000);
  }

  btnAdd.addEventListener('click', addShow);
  newName.addEventListener('keydown', e => { if (e.key === 'Enter') addShow(); });
  newCode.addEventListener('keydown', e => { if (e.key === 'Enter') newName.focus(); });

  // ── Helpers ────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  loadShows();
}());
</script>
</body>
</html>

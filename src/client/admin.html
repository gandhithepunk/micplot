<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="MicPlot" />
  <meta name="theme-color" content="#7a5cf0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>Mic Plot — Admin</title>
  <style>
    :root {
      --bg: #000000;
      --card: #141414;
      --field: #111111;
      --border: #2c2c2c;
      --border-light: #3a3a3a;
      --accent: #7a5cf0;
      --green: #3f9e6d;
      --red: #c25b52;
      --text: #eaeaea;
      --text-muted: #888888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 500;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }
    .page { max-width: 600px; margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    .page-header-left {}
    .page-header-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 500; }
    /* ── Hamburger nav ── */
    .hamburger-wrap { position: relative; }
    .hamburger-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.35rem 0.55rem;
    }
    .hamburger-btn:hover { color: var(--text); border-color: var(--border-light); }
    .hamburger-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 0.4rem;
      min-width: 130px;
      z-index: 100;
    }
    .hamburger-menu.open { display: block; }
    .nav-link {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.55rem 0.75rem;
      border-radius: 5px;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--text); background: var(--field); }
    .nav-link.active { color: var(--accent); }

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .section-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.875rem;
      line-height: 1.5;
    }

    /* Add show form */
    .add-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .add-row input {
      background: var(--field);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.6rem 0.75rem;
      -webkit-appearance: none;
    }
    .add-row input:focus { outline: none; border-color: var(--accent); }
    .input-code { width: 7rem; }
    .input-name { flex: 1; min-width: 160px; }
    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.6rem 1.25rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-add:hover { opacity: 0.9; }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; }
    .form-msg { margin-top: 0.6rem; font-size: 0.8rem; min-height: 1em; }
    .form-msg.error { color: var(--red); }
    .form-msg.success { color: var(--green); }

    /* Show rows */
    .shows-list { display: flex; flex-direction: column; }
    .show-row { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .show-row:last-child { border-bottom: none; }
    .show-row.dimmed { opacity: 0.6; }

    .row-main { display: flex; align-items: center; gap: 0.75rem; }
    .show-code { font-size: 0.75rem; color: var(--text-muted); min-width: 3rem; }
    .show-name { flex: 1; font-size: 0.95rem; }
    .row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }

    /* Small buttons */
    .btn-sm {
      border-radius: 5px;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid var(--border-light);
      background: var(--field);
      color: var(--text-muted);
    }
    .btn-sm:hover { color: var(--text); }
    .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Toggle: shows current state, click to flip */
    .btn-toggle-active {
      border-color: rgba(63,158,109,0.4);
      color: var(--green);
      background: rgba(63,158,109,0.08);
    }
    .btn-toggle-active:hover { background: rgba(63,158,109,0.16); }
    .btn-toggle-inactive {
      border-color: var(--border-light);
      color: var(--text-muted);
    }
    .btn-toggle-inactive:hover { color: var(--text); }

    .btn-archive:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-restore { color: var(--accent); border-color: rgba(122,92,240,0.4); }
    .btn-restore:hover { background: rgba(122,92,240,0.08); }
    .btn-delete-show { color: var(--red); border-color: rgba(194,91,82,0.35); }
    .btn-delete-show:hover { background: rgba(194,91,82,0.08); }
    .btn-save-edit { color: var(--accent); border-color: rgba(122,92,240,0.4); }
    .btn-save-edit:hover { background: rgba(122,92,240,0.08); }

    /* Inline edit */
    .row-edit { display: none; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .row-edit input {
      background: var(--field);
      border: 1px solid var(--border-light);
      border-radius: 5px;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.35rem 0.6rem;
    }
    .row-edit input:focus { outline: none; border-color: var(--accent); }
    .edit-code-input { width: 6rem; }
    .edit-name-input { flex: 1; min-width: 140px; }

    /* Delete confirmation */
    .row-confirm {
      display: none;
      margin-top: 0.6rem;
      padding: 0.75rem;
      background: rgba(194,91,82,0.07);
      border: 1px solid rgba(194,91,82,0.25);
      border-radius: 6px;
    }
    .confirm-msg { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.6rem; }
    .confirm-actions { display: flex; gap: 0.5rem; }
    .btn-confirm-cancel {
      flex: 1; background: var(--field); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text-muted); font-family: inherit;
      font-weight: 500; font-size: 0.82rem; padding: 0.4rem; cursor: pointer;
    }
    .btn-confirm-delete {
      flex: 1; background: var(--red); border: none;
      border-radius: 5px; color: #fff; font-family: inherit;
      font-weight: 500; font-size: 0.82rem; padding: 0.4rem; cursor: pointer;
    }
    .btn-confirm-delete:hover { opacity: 0.85; }
    .btn-confirm-delete:disabled { opacity: 0.45; cursor: not-allowed; }

    .row-msg { margin-top: 0.4rem; font-size: 0.78rem; color: var(--red); min-height: 1em; }

    .empty-list { font-size: 0.875rem; color: var(--text-muted); padding: 0.25rem 0; }

    /* Hidden until populated */
    .optional-section { display: none; }

    /* Show setup section */
    .show-setup {
      display: none;
      margin-top: 0.75rem;
      padding: 0.875rem;
      background: var(--field);
      border: 1px solid var(--border-light);
      border-radius: 6px;
    }
    .setup-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .setup-count strong { color: var(--text); }
    .setup-form { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .setup-form input[type="number"] {
      width: 5rem;
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: 5px;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.45rem 0.6rem;
      -webkit-appearance: none;
    }
    .setup-form input[type="number"]:focus { outline: none; border-color: var(--accent); }
    .setup-form label { font-size: 0.85rem; color: var(--text-muted); }
    .btn-generate {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:disabled { opacity: 0.45; cursor: not-allowed; }
    .setup-msg { margin-top: 0.5rem; font-size: 0.78rem; min-height: 1em; }
    .setup-msg.success { color: var(--green); }
    .setup-msg.error { color: var(--red); }

    /* Field toggles */
    .setup-divider { height: 1px; background: var(--border); margin: 0.875rem 0; }
    .field-toggles { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; }
    .field-toggle-label {
      display: flex; align-items: center; gap: 0.35rem;
      font-size: 0.8rem; color: var(--text-muted); cursor: pointer;
    }
    .field-toggle-label input[type="checkbox"] {
      accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer;
    }

    /* Spreadsheet grid */
    .setup-grid-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 0.875rem;
    }
    .setup-grid { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
    .setup-grid th {
      background: var(--field);
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.4rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .setup-grid td { border-bottom: 1px solid var(--border); padding: 0; }
    .setup-grid tr:last-child td { border-bottom: none; }
    .setup-grid .grid-mic-id {
      padding: 0 0.6rem;
      color: var(--text-muted);
      white-space: nowrap;
      font-size: 0.78rem;
      min-width: 3rem;
    }
    .setup-grid td input {
      background: transparent;
      border: none;
      border-left: 2px solid transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.4rem 0.6rem;
      width: 100%;
      min-width: 100px;
      outline: none;
      -webkit-appearance: none;
    }
    .setup-grid td input:focus {
      border-left-color: var(--accent);
      background: rgba(122,92,240,0.06);
    }
    .setup-grid tr.saving td { opacity: 0.5; }
    .setup-grid tr.saved td { background: rgba(63,158,109,0.08); }
    .setup-grid tr.error td { background: rgba(194,91,82,0.08); }

    /* ── PIN overlay ── */
    .pin-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .pin-overlay.visible { display: flex; }
    .pin-card {
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 2rem 2rem 1.75rem;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .pin-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.4rem; }
    .pin-title { font-size: 1.4rem; font-weight: 500; margin-bottom: 1.5rem; }
    .pin-input {
      width: 100%;
      background: var(--field);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      padding: 0.6rem 0.75rem;
      text-align: center;
      margin-bottom: 0.75rem;
    }
    .pin-input:focus { outline: none; border-color: var(--accent); }
    .pin-input.shake {
      animation: pin-shake 0.35s ease;
      border-color: var(--red);
    }
    @keyframes pin-shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      60%      { transform: translateX(8px); }
      80%      { transform: translateX(-4px); }
    }
    .pin-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.65rem;
    }
    .pin-btn:hover { opacity: 0.9; }
    .pin-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .pin-error { color: var(--red); font-size: 0.8rem; margin-top: 0.6rem; min-height: 1em; }
  </style>
</head>
<body>

<!-- PIN overlay (hidden when ADMIN_PIN not set or already authenticated) -->
<div class="pin-overlay" id="pin-overlay">
  <div class="pin-card">
    <div class="pin-label">Mic Plot</div>
    <div class="pin-title">Admin Access</div>
    <input class="pin-input" id="pin-input" type="password"
           inputmode="numeric" placeholder="••••" autocomplete="off" maxlength="8" />
    <button class="pin-btn" id="pin-btn" type="button">Unlock</button>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<div class="page" id="admin-content" style="display:none">

  <div class="page-header">
    <div class="page-header-left">
      <div class="page-header-label">Mic Plot</div>
      <h1>Admin</h1>
    </div>
    <div class="hamburger-wrap">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">☰</button>
      <nav class="hamburger-menu" id="hamburger-menu">
        <a href="/mic-form.html" class="nav-link">Mic Entry</a>
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/admin.html" class="nav-link active">Admin</a>
        <div style="height:1px;background:var(--border);margin:0.25rem 0;"></div>
        <button class="nav-link" id="share-btn" style="background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:inherit;">Share</button>
      </nav>
    </div>
  </div>

  <!-- Add show -->
  <div class="section">
    <div class="section-label">Add Show</div>
    <div class="add-row">
      <input class="input-code" id="new-code" type="text" placeholder="Code (HAM)" autocomplete="off" maxlength="10" />
      <input class="input-name" id="new-name" type="text" placeholder="Name (Hamlet)" autocomplete="off" />
      <button class="btn-add" id="btn-add" type="button">Add</button>
    </div>
    <div class="form-msg" id="add-msg"></div>
  </div>

  <!-- Active shows -->
  <div class="section">
    <div class="section-label">Active Shows</div>
    <div class="shows-list" id="active-list">
      <div class="empty-list">Loading...</div>
    </div>
  </div>

  <!-- Inactive / prep shows -->
  <div class="section optional-section" id="inactive-section">
    <div class="section-label">Inactive Shows</div>
    <div class="section-note">Not visible to crew. Toggle active when the show is ready.</div>
    <div class="shows-list" id="inactive-list"></div>
  </div>

  <!-- Archived shows -->
  <div class="section optional-section" id="archived-section">
    <div class="section-label">Archived Shows</div>
    <div class="section-note">Finished shows. Deleting permanently removes all mic entries and photos.</div>
    <div class="shows-list" id="archived-list"></div>
  </div>

</div>
<script>
// ── Hamburger menu ───────────────────────────────────────────────────────────
(function () {
  const btn  = document.getElementById('hamburger-btn');
  const menu = document.getElementById('hamburger-menu');
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', () => {
    menu.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  });
})();

// ── QR share ─────────────────────────────────────────────────────────────────
document.getElementById('share-btn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('hamburger-menu').classList.remove('open');
  document.getElementById('hamburger-btn').setAttribute('aria-expanded', 'false');
  const url = encodeURIComponent(window.location.origin + '/dashboard.html');
  document.getElementById('qr-img').src = `/qr?url=${url}`;
  document.getElementById('qr-modal').style.display = 'flex';
});

// ── Admin PIN gate ────────────────────────────────────────────────────────────
(function () {
  const overlay  = document.getElementById('pin-overlay');
  const content  = document.getElementById('admin-content');
  const pinInput = document.getElementById('pin-input');
  const pinBtn   = document.getElementById('pin-btn');
  const pinError = document.getElementById('pin-error');

  function reveal() {
    overlay.classList.remove('visible');
    content.style.display = 'block';
  }

  function showOverlay() {
    overlay.classList.add('visible');
    content.style.display = 'none';
    pinInput.focus();
  }

  // Check if already authenticated
  fetch('/api/admin/check')
    .then(r => r.ok ? reveal() : showOverlay())
    .catch(() => showOverlay());

  async function submitPin() {
    const pin = pinInput.value.trim();
    if (!pin) return;
    pinBtn.disabled = true;
    pinError.textContent = '';
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    pinBtn.disabled = false;
    if (r.ok) {
      reveal();
    } else {
      pinInput.value = '';
      pinInput.classList.add('shake');
      pinInput.addEventListener('animationend', () => pinInput.classList.remove('shake'), { once: true });
      pinError.textContent = 'Incorrect PIN';
      pinInput.focus();
    }
  }

  pinBtn.addEventListener('click', submitPin);
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });
})();

(function () {
  let shows = [];

  // ── Shared field config constants ──────────────────────────────────────────
  const OPTIONAL_FIELDS = [
    { key: 'character',    label: 'Character'   },
    { key: 'pronouns',    label: 'Pronouns'    },
    { key: 'micColor',    label: 'Mic Color'   },
    { key: 'placement',   label: 'Placement'   },
    { key: 'sensitivity', label: 'Sensitivity' },
    { key: 'allergy',     label: 'Allergy'     },
    { key: 'notes',       label: 'Notes'       },
    { key: 'micModel',    label: 'Mic Model'   },
    { key: 'frequency',   label: 'Frequency'   },
    { key: 'packModel',   label: 'Pack Model'  },
  ];
  function isFieldEnabled(cfg, key) {
    if (!cfg) return true;
    if (!(key in cfg)) return true;
    return cfg[key] !== false;
  }

  const activeList   = document.getElementById('active-list');
  const inactiveList = document.getElementById('inactive-list');
  const archivedList = document.getElementById('archived-list');
  const inactiveSec  = document.getElementById('inactive-section');
  const archivedSec  = document.getElementById('archived-section');
  const newCode      = document.getElementById('new-code');
  const newName      = document.getElementById('new-name');
  const btnAdd       = document.getElementById('btn-add');
  const addMsg       = document.getElementById('add-msg');

  // ── Load ───────────────────────────────────────────────────────────────────
  async function loadShows() {
    try {
      const res = await fetch('/api/shows');
      shows = await res.json();
      renderShows();
    } catch {
      activeList.innerHTML = '<div class="empty-list">Failed to load shows.</div>';
    }
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderShows() {
    const active   = shows.filter(s => s.active && !s.archived);
    const inactive = shows.filter(s => !s.active && !s.archived);
    const archived = shows.filter(s => s.archived);

    renderList(activeList, active, 'active');
    renderList(inactiveList, inactive, 'inactive');
    renderList(archivedList, archived, 'archived');

    inactiveSec.style.display = inactive.length > 0 ? 'block' : 'none';
    archivedSec.style.display = archived.length > 0 ? 'block' : 'none';
  }

  function renderList(container, items, type) {
    container.innerHTML = '';
    if (items.length === 0) {
      if (type === 'active') container.innerHTML = '<div class="empty-list">No active shows.</div>';
      return;
    }
    items.forEach(s => container.appendChild(makeRow(s, type)));
  }

  // ── Row builder ────────────────────────────────────────────────────────────
  function makeRow(show, type) {
    const div = document.createElement('div');
    div.className = 'show-row' + (type !== 'active' ? ' dimmed' : '');
    div.dataset.id = show.id;

    if (type === 'archived') {
      // Archived: Restore + Delete with confirmation
      div.innerHTML = `
        <div class="row-main">
          <span class="show-code">${esc(show.code)}</span>
          <span class="show-name">${esc(show.name)}</span>
          <div class="row-actions">
            <button class="btn-sm btn-restore" type="button">Restore</button>
            <button class="btn-sm btn-delete-show" type="button">Delete</button>
          </div>
        </div>
        <div class="row-confirm">
          <div class="confirm-msg">
            Permanently delete <strong>${esc(show.name)}</strong>?
            All mic entries and photos will be deleted. This cannot be undone.
          </div>
          <div class="confirm-actions">
            <button class="btn-confirm-cancel" type="button">Cancel</button>
            <button class="btn-confirm-delete" type="button">Delete Forever</button>
          </div>
        </div>
        <div class="row-msg"></div>
      `;

      const rowMsg        = div.querySelector('.row-msg');
      const restoreBtn    = div.querySelector('.btn-restore');
      const deleteBtn     = div.querySelector('.btn-delete-show');
      const rowConfirm    = div.querySelector('.row-confirm');
      const confirmCancel = div.querySelector('.btn-confirm-cancel');
      const confirmDelete = div.querySelector('.btn-confirm-delete');

      restoreBtn.addEventListener('click', () => patch(show.id, { archived: false }, rowMsg, restoreBtn));

      deleteBtn.addEventListener('click', () => {
        rowConfirm.style.display = 'block';
        deleteBtn.style.display = 'none';
      });
      confirmCancel.addEventListener('click', () => {
        rowConfirm.style.display = 'none';
        deleteBtn.style.display = '';
        rowMsg.textContent = '';
      });
      confirmDelete.addEventListener('click', async () => {
        confirmDelete.disabled = true;
        confirmDelete.textContent = 'Deleting...';
        try {
          const res = await fetch(`/api/shows/${show.id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error();
          await loadShows();
        } catch {
          confirmDelete.disabled = false;
          confirmDelete.textContent = 'Delete Forever';
          rowMsg.textContent = 'Delete failed.';
        }
      });

    } else {
      // Active or Inactive: toggle + edit + archive
      const isActive = type === 'active';
      div.innerHTML = `
        <div class="row-main">
          <span class="show-code">${esc(show.code)}</span>
          <span class="show-name">${esc(show.name)}</span>
          <div class="row-actions">
            <button class="btn-sm ${isActive ? 'btn-toggle-active' : 'btn-toggle-inactive'} toggle-btn" type="button">
              ${isActive ? 'Active' : 'Inactive'}
            </button>
            <button class="btn-sm edit-btn" type="button">Edit</button>
            <button class="btn-sm btn-setup" type="button">Set Up</button>
            <button class="btn-sm btn-archive" type="button">Archive</button>
          </div>
        </div>
        <div class="row-edit">
          <input class="edit-code-input" type="text" value="${esc(show.code)}" maxlength="10" autocomplete="off" />
          <input class="edit-name-input" type="text" value="${esc(show.name)}" autocomplete="off" />
          <div class="row-actions">
            <button class="btn-sm btn-save-edit" type="button">Save</button>
            <button class="btn-sm btn-cancel-edit" type="button">Cancel</button>
          </div>
        </div>
        <div class="show-setup">
          <div class="setup-count">Loading...</div>
          <div class="setup-form">
            <input type="number" min="1" max="99" placeholder="16" />
            <label>mics (01 – N)</label>
            <button class="btn-generate" type="button">Generate</button>
          </div>
          <div class="setup-msg"></div>
          <div class="setup-divider" style="display:none"></div>
          <div class="field-toggles-wrap"></div>
          <div class="setup-grid-slot"></div>
        </div>
        <div class="row-msg"></div>
      `;

      const rowMain          = div.querySelector('.row-main');
      const rowEdit          = div.querySelector('.row-edit');
      const rowMsg           = div.querySelector('.row-msg');
      const toggleBtn        = div.querySelector('.toggle-btn');
      const editBtn          = div.querySelector('.edit-btn');
      const setupBtn         = div.querySelector('.btn-setup');
      const archiveBtn       = div.querySelector('.btn-archive');
      const saveBtn          = div.querySelector('.btn-save-edit');
      const cancelBtn        = div.querySelector('.btn-cancel-edit');
      const codeInput        = div.querySelector('.edit-code-input');
      const nameInput        = div.querySelector('.edit-name-input');
      const setupPanel       = div.querySelector('.show-setup');
      const setupCount       = div.querySelector('.setup-count');
      const setupInput       = div.querySelector('.setup-form input');
      const generateBtn      = div.querySelector('.btn-generate');
      const setupMsg         = div.querySelector('.setup-msg');
      const setupDivider     = div.querySelector('.setup-divider');
      const fieldTogglesWrap = div.querySelector('.field-toggles-wrap');
      const setupGridSlot    = div.querySelector('.setup-grid-slot');

      let currentMicsCache   = [];
      let currentFieldConfig = show.fieldConfig; // null or object from API

      toggleBtn.addEventListener('click', () =>
        patch(show.id, { active: !isActive }, rowMsg, toggleBtn)
      );

      archiveBtn.addEventListener('click', () =>
        patch(show.id, { active: false, archived: true }, rowMsg, archiveBtn)
      );

      editBtn.addEventListener('click', () => {
        rowMain.style.display = 'none';
        rowEdit.style.display = 'flex';
        setupPanel.style.display = 'none';
        nameInput.focus();
      });

      cancelBtn.addEventListener('click', () => {
        rowEdit.style.display = 'none';
        rowMain.style.display = 'flex';
        rowMsg.textContent = '';
      });

      saveBtn.addEventListener('click', async () => {
        const code = codeInput.value.trim();
        const name = nameInput.value.trim();
        if (!code || !name) { rowMsg.textContent = 'Code and name are required.'; return; }
        saveBtn.disabled = true;
        try {
          const res = await fetch(`/api/shows/${show.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, name }),
          });
          if (!res.ok) throw new Error();
          await loadShows();
        } catch {
          rowMsg.textContent = 'Save failed.';
          saveBtn.disabled = false;
        }
      });

      // Set Up toggle
      let setupLoaded = false;
      setupBtn.addEventListener('click', async () => {
        const isOpen = setupPanel.style.display === 'block';
        if (isOpen) {
          setupPanel.style.display = 'none';
          return;
        }
        rowEdit.style.display = 'none';
        rowMain.style.display = 'flex';
        setupPanel.style.display = 'block';
        if (!setupLoaded) {
          await refreshSetupCount();
          buildToggles(currentFieldConfig);
          setupDivider.style.display = 'block';
          setupLoaded = true;
        }
      });

      async function refreshSetupCount() {
        try {
          const res = await fetch(`/api/shows/${show.id}/mics`);
          const mics = await res.json();
          currentMicsCache = mics;
          const total = mics.length;
          const assigned = mics.filter(m => m.performer).length;
          if (total === 0) {
            setupCount.innerHTML = 'No mics set up yet.';
          } else {
            setupCount.innerHTML = `<strong>${total}</strong> mic${total !== 1 ? 's' : ''} set up` +
              (assigned > 0 ? `, <strong>${assigned}</strong> assigned` : ', none assigned yet') + '.';
          }
          buildGrid(currentFieldConfig, currentMicsCache);
        } catch {
          setupCount.textContent = 'Could not load mic count.';
        }
      }

      function buildToggles(cfg) {
        fieldTogglesWrap.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'field-toggles';
        for (const f of OPTIONAL_FIELDS) {
          const label = document.createElement('label');
          label.className = 'field-toggle-label';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.dataset.key = f.key;
          cb.checked = isFieldEnabled(cfg, f.key);
          cb.addEventListener('change', async () => {
            const newCfg = {};
            for (const inp of fieldTogglesWrap.querySelectorAll('input[type="checkbox"]')) {
              newCfg[inp.dataset.key] = inp.checked;
            }
            try {
              const res = await fetch(`/api/shows/${show.id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fieldConfig: newCfg }),
              });
              if (res.ok) {
                const updated = await res.json();
                currentFieldConfig = updated.fieldConfig;
                buildGrid(currentFieldConfig, currentMicsCache);
              }
            } catch { /* ignore */ }
          });
          label.appendChild(cb);
          label.appendChild(document.createTextNode('\u00a0' + f.label));
          wrap.appendChild(label);
        }
        fieldTogglesWrap.appendChild(wrap);
      }

      function buildGrid(cfg, mics) {
        setupGridSlot.innerHTML = '';
        if (mics.length === 0) return;

        const enabledFields = OPTIONAL_FIELDS.filter(f => isFieldEnabled(cfg, f.key));
        const numDataCols = 1 + enabledFields.length; // performer + enabled optional

        const outerWrap = document.createElement('div');
        outerWrap.className = 'setup-grid-wrap';

        const table = document.createElement('table');
        table.className = 'setup-grid';

        // Header row
        const thead = document.createElement('thead');
        const hr = document.createElement('tr');
        [{ label: 'Mic' }, { label: 'Performer' }, ...enabledFields].forEach(f => {
          const th = document.createElement('th');
          th.textContent = f.label;
          hr.appendChild(th);
        });
        thead.appendChild(hr);
        table.appendChild(thead);

        // Body rows
        const tbody = document.createElement('tbody');
        const sorted = [...mics].sort((a, b) =>
          a.micId.localeCompare(b.micId, undefined, { numeric: true })
        );

        for (const mic of sorted) {
          const tr = document.createElement('tr');
          tr.dataset.micId = mic.micId;

          const tdMic = document.createElement('td');
          tdMic.className = 'grid-mic-id';
          tdMic.textContent = mic.micId;
          tr.appendChild(tdMic);

          // Performer (always)
          const tdPerf = document.createElement('td');
          const inpPerf = document.createElement('input');
          inpPerf.type = 'text';
          inpPerf.value = mic.performer || '';
          inpPerf.dataset.field = 'performer';
          tdPerf.appendChild(inpPerf);
          tr.appendChild(tdPerf);

          // Enabled optional fields
          for (const f of enabledFields) {
            const td = document.createElement('td');
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.value = mic[f.key] || '';
            inp.dataset.field = f.key;
            td.appendChild(inp);
            tr.appendChild(td);
          }

          tbody.appendChild(tr);
        }
        table.appendChild(tbody);

        // Flat input list for Enter-key navigation
        const allInputs = Array.from(table.querySelectorAll('tbody input'));

        table.addEventListener('focusin', e => {
          if (e.target.tagName === 'INPUT') e.target._originalValue = e.target.value;
        });

        table.addEventListener('focusout', e => {
          if (e.target.tagName !== 'INPUT') return;
          if (e.target.value === e.target._originalValue) return;
          const tr = e.target.closest('tr');
          saveRow(tr.dataset.micId, tr);
        });

        table.addEventListener('keydown', e => {
          if (e.target.tagName !== 'INPUT' || e.key !== 'Enter') return;
          e.preventDefault();
          const idx = allInputs.indexOf(e.target);
          const nextIdx = idx + numDataCols;
          if (nextIdx < allInputs.length) allInputs[nextIdx].focus();
        });

        outerWrap.appendChild(table);
        setupGridSlot.appendChild(outerWrap);
      }

      async function saveRow(micId, tr) {
        tr.classList.add('saving');
        tr.classList.remove('saved', 'error');
        const body = {};
        for (const inp of tr.querySelectorAll('input[data-field]')) {
          body[inp.dataset.field] = inp.value;
        }
        try {
          const res = await fetch(
            `/api/shows/${show.id}/mics/${encodeURIComponent(micId)}`,
            { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
          );
          if (!res.ok) throw new Error();
          const updated = await res.json();
          const idx = currentMicsCache.findIndex(m => m.micId === micId);
          if (idx !== -1) currentMicsCache[idx] = updated;
          tr.classList.remove('saving');
          tr.classList.add('saved');
          // Also refresh the count (assigned count may have changed)
          const total = currentMicsCache.length;
          const assigned = currentMicsCache.filter(m => m.performer).length;
          setupCount.innerHTML = `<strong>${total}</strong> mic${total !== 1 ? 's' : ''} set up` +
            (assigned > 0 ? `, <strong>${assigned}</strong> assigned` : ', none assigned yet') + '.';
          setTimeout(() => tr.classList.remove('saved'), 1200);
        } catch {
          tr.classList.remove('saving');
          tr.classList.add('error');
          setTimeout(() => tr.classList.remove('error'), 2000);
        }
      }

      generateBtn.addEventListener('click', async () => {
        const count = parseInt(setupInput.value, 10);
        if (!count || count < 1 || count > 99) {
          setupMsg.textContent = 'Enter a number between 1 and 99.';
          setupMsg.className = 'setup-msg error';
          return;
        }
        generateBtn.disabled = true;
        setupMsg.textContent = '';
        try {
          const res = await fetch(`/api/shows/${show.id}/mics/bulk`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ count }),
          });
          if (!res.ok) throw new Error();
          const { created, skipped } = await res.json();
          await refreshSetupCount();
          if (created > 0) {
            setupMsg.textContent = `Created ${created} mic${created !== 1 ? 's' : ''}` +
              (skipped > 0 ? ` (${skipped} already existed)` : '') + '.';
            setupMsg.className = 'setup-msg success';
          } else {
            setupMsg.textContent = `All ${skipped} mics already exist.`;
            setupMsg.className = 'setup-msg';
          }
        } catch {
          setupMsg.textContent = 'Failed to generate mics.';
          setupMsg.className = 'setup-msg error';
        } finally {
          generateBtn.disabled = false;
        }
      });
    }

    return div;
  }

  // ── Shared PATCH helper ────────────────────────────────────────────────────
  async function patch(id, body, msgEl, btn) {
    if (btn) btn.disabled = true;
    try {
      const res = await fetch(`/api/shows/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error();
      await loadShows();
    } catch {
      if (msgEl) msgEl.textContent = 'Action failed.';
      if (btn) btn.disabled = false;
    }
  }

  // ── Add show ───────────────────────────────────────────────────────────────
  async function addShow() {
    const code = newCode.value.trim();
    const name = newName.value.trim();
    if (!code || !name) { setAddMsg('Code and name are required.', 'error'); return; }

    btnAdd.disabled = true;
    setAddMsg('', '');
    try {
      const res = await fetch('/api/shows', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, name }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Failed');
      }
      newCode.value = '';
      newName.value = '';
      setAddMsg('Show added.', 'success');
      await loadShows();
    } catch (err) {
      setAddMsg(err.message || 'Failed to add show.', 'error');
    } finally {
      btnAdd.disabled = false;
    }
  }

  function setAddMsg(msg, type) {
    addMsg.textContent = msg;
    addMsg.className = 'form-msg' + (type ? ` ${type}` : '');
    if (type === 'success') setTimeout(() => { addMsg.textContent = ''; }, 3000);
  }

  btnAdd.addEventListener('click', addShow);
  newCode.addEventListener('keydown', e => { if (e.key === 'Enter') newName.focus(); });
  newName.addEventListener('keydown', e => { if (e.key === 'Enter') addShow(); });

  // ── Helpers ────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  loadShows();
}());
</script>
<div id="qr-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;" onclick="this.style.display='none'">
  <div style="background:var(--card);border:1px solid var(--border-light);border-radius:12px;padding:1.5rem;text-align:center;max-width:280px;width:90%;" onclick="event.stopPropagation()">
    <p style="color:var(--text-muted);font-size:0.75rem;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:1rem;">Scan to open dashboard</p>
    <img id="qr-img" src="" alt="QR Code" style="width:100%;display:block;border-radius:4px;" />
    <button onclick="document.getElementById('qr-modal').style.display='none'" style="margin-top:1rem;width:100%;background:var(--field);border:1px solid var(--border);color:var(--text-muted);padding:0.5rem;border-radius:6px;cursor:pointer;font-size:0.875rem;font-family:inherit;">Close</button>
  </div>
</div>
</body>
</html>
